name: DB Backup

# Respaldo diario de la base Supabase (el plan free no incluye backups/PITR).
# Requiere el secret SUPABASE_DB_URL = connection string de la DB
# (Dashboard -> Project Settings -> Database -> Connection string, con el password).
# Para retención larga, subir el .dump a S3/R2 en vez de artifacts, o pasar a un
# plan de Supabase con PITR.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC diario
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump de la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ts=$(date -u +%Y%m%d-%H%M)
          echo "ts=$ts" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "backup-$ts.dump"
          ls -lh "backup-$ts.dump"

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.ts }}
          path: backup-*.dump
          retention-days: 30
          if-no-files-found: error
