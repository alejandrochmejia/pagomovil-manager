services:
  - type: web
    name: pagomovil-manager-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SCAN_MODEL
        value: gemini-2.5-flash
      - key: ENVIRONMENT
        value: production
      # Opcionales (tienen defaults en el código):
      - key: CORS_ORIGINS      # orígenes web extra separados por coma (Capacitor/localhost ya van por defecto)
        sync: false
      - key: SENTRY_DSN        # error tracking opcional; si está vacío, Sentry no se inicializa
        sync: false
      - key: RESET_REDIRECT_URL  # URL del frontend para el email de recuperación de contraseña
        sync: false
